<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070a12"><title>CHAOS ARENA</title><link rel="stylesheet" href="/style.css"></head><body><main id="app">
<section id="menu" class="screen"><div class="brand"><span>CHAOS</span><b>ARENA</b></div><p class="tag">SURVIVE THE CHAOS.</p><input id="name" maxlength="16" placeholder="Nickname"><select id="char"><option value="dasher">DASHER · PHASE DASH</option><option value="tank">TANK · SHIELD BURST</option><option value="trickster">TRICKSTER · DECOY</option><option value="gravity">GRAVITY · PULSE</option><option value="frost">FROST · FREEZE</option><option value="shock">SHOCK · CHAIN SHOCK</option></select><div class="row"><button id="create">CREATE ROOM</button><button id="quick">QUICK ROOM</button></div><div class="join"><input id="room" maxlength="6" placeholder="ROOM CODE"><button id="join">JOIN</button></div><small>2–8 players · desktop / tablet / mobile</small></section>
<section id="lobby" class="screen hidden"><div class="top"><div class="brand mini">CHAOS <b>ARENA</b></div><button id="leave">LEAVE</button></div><div class="panel"><div class="roomCode">ROOM <strong id="code">------</strong><button id="copy">COPY</button></div><div id="players" class="players"></div><div class="row"><button id="ready">READY</button><button id="start" class="accent">START MATCH</button></div><p id="lobbyMsg">Waiting for players…</p></div></section>
<section id="game" class="screen game hidden"><canvas id="canvas"></canvas><div class="hud"><div class="stat"><span id="meName">PLAYER</span><div class="bar"><i id="hp"></i></div></div><div class="center"><b id="timer">5:00</b><span id="event">CHAOS ARENA</span></div><div class="stat right"><b id="remaining">0</b><span>ALIVE</span></div></div><button id="ability" class="ability">ABILITY<span id="cd"></span></button><div id="joystick" class="joystick"><i></i></div><div id="toast"></div></section>
<section id="results" class="screen hidden"><div class="brand"><span>CHAOS</span><b>ARENA</b></div><h1 id="winner">CHAOS CHAMPION</h1><div id="resultStats" class="result"></div><button id="again">PLAY AGAIN</button><button id="menuBtn">MAIN MENU</button></section></main><script src="/game.js"></script></body></html>
